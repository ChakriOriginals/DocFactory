# Local development stack. Images are pinned to exact tags so `make up` today
# and `make up` in six months produce the same stack.
#
# Healthcheck tooling differs per image (verified against these exact tags):
# postgres ships pg_isready, minio ships curl, elasticmq-native is busybox-based
# (wget), phoenix is shell-less but ships python.
name: docfactory

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docfactory}
      POSTGRES_DB: ${POSTGRES_DB:-docfactory}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # SQS-compatible queue. In-memory: queue contents do not survive a restart,
  # which is fine locally — documents are re-driveable from storage + db state.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324" # SQS API
      - "9325:9325" # web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 3s
      retries: 12

  phoenix:
    image: arizephoenix/phoenix:20.2.1
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006" # UI + OTLP/HTTP collector
      - "4317:4317" # OTLP/gRPC collector
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  pgdata:
  minio-data:
  phoenix-data:
